<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cash Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFECE7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cash Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Cash Log — "Calm rows". The amount is the only large element;
   category, source and note are quiet rows that open a sheet.
   Design tokens are lifted verbatim from the handoff.
   ============================================================ */
:root{
  --page:#EFECE7; --surface:#FBFAF8; --raised:#FFFDFB; --muted:#F1EDE7; --selected:#F4F1EC;
  --border:#E7E2DB; --border-strong:#E3DED7; --hairline:#EFEAE3;
  --ink:#1C1917; --secondary:#57534E; --dim:#78716C; --faint:#8C837A; --place:#66605A; --chev:#857C72;
  --out:#9A2C2C; --out-tint:#FBEDEC; --in:#166534; --in-tint:#E9F0E5;
  --warn:#B45309; --warn-tint:#FBF0DC; --warn-ink:#8A5A0B; --on-dark:#FBFAF8; --on-dark2:#FFF8EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px;-webkit-text-size-adjust:100%}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums}
input{font-family:inherit}

/* mobile shell — no fake status bar or device chrome; the real OS draws it */
.shell{height:100dvh;min-height:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  background:var(--surface);position:relative;overflow:hidden}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}

/* band */
.band{display:flex;align-items:center;gap:9px;padding:calc(9px + env(safe-area-inset-top)) 22px 9px;
  font-size:12.5px;font-weight:500;color:var(--on-dark2)}
.band .dot{width:7px;height:7px;border-radius:50%;background:var(--on-dark2);opacity:.85;flex:none}
.band.off{background:var(--out)} .band.queued{background:var(--warn)}

.head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
.head.safe{padding-top:calc(14px + env(safe-area-inset-top))}
.date{font-size:11.5px;color:var(--faint)}
.userchip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:99px;
  background:var(--muted);cursor:pointer;min-height:36px;border:0}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#3B3733;flex:none}
.userchip .name{font-size:12.5px;color:var(--secondary)}

/* amount block */
.amountwrap{display:flex;flex-direction:column;gap:14px;align-items:center;padding:8px 22px 0}
.seg{display:flex;padding:3px;background:var(--muted);border-radius:99px;gap:3px}
.seg button{border:0;padding:9px 20px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;
  min-height:40px;background:transparent;color:var(--faint);font-family:inherit}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(28,25,23,.12)}
.amount{display:flex;align-items:baseline;gap:8px;cursor:pointer;padding:6px 4px;border:0;background:0}
.amount .big{font-size:48px;letter-spacing:-.03em;color:var(--place)}
.amount .big.out{color:var(--out)} .amount .big.in{color:var(--in)}
.amount .cur{font-size:16px;color:var(--faint)}
.hint{font-size:12px;color:var(--faint);margin-top:-6px}

/* field rows */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--hairline);padding:0 22px;margin-top:26px}
.row{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--hairline);
  cursor:pointer;min-height:60px;background:0;border:0;text-align:left;width:100%;font-family:inherit}
.row .lbl{width:112px;flex:none;font-size:13.5px;color:var(--secondary);font-weight:500}
.row .val{flex:1;min-width:0;font-size:15px;color:var(--ink);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val.empty{color:var(--place);font-weight:400}
.row .chev{font-size:15px;color:var(--chev)}
.derived{font-size:12px;color:var(--faint);text-align:center;padding:16px 22px 0}

.emptystate{padding:60px 30px;text-align:center;color:var(--faint);font-size:14px;line-height:1.5}

/* primary button */
.submitwrap{padding:10px 22px 12px}
.submit{width:100%;border:0;padding:15px;border-radius:14px;text-align:center;font-size:15.5px;
  font-weight:600;min-height:50px;font-family:inherit;background:#EDE9E3;color:var(--faint)}
.submit.ready{cursor:pointer;color:var(--on-dark)}
.submit.ready.online{background:var(--in)} .submit.ready.offline{background:var(--warn)}

/* bottom tabs */
.tabs{display:flex;background:var(--surface);padding:4px 14px calc(16px + env(safe-area-inset-bottom));gap:6px}
.tabs button{flex:1;border:0;text-align:center;padding:11px;border-radius:10px;font-size:13px;cursor:pointer;
  min-height:44px;color:var(--faint);background:transparent;font-family:inherit}
.tabs button.on{color:var(--ink);font-weight:600;background:var(--muted)}

/* history */
.histbar{display:flex;justify-content:space-between;align-items:center;padding:4px 18px 8px}
.backlink{border:0;background:0;font-family:inherit;font-size:14px;font-weight:500;color:var(--secondary);
  padding:8px 4px;min-height:44px;cursor:pointer}
.figs{display:flex;gap:22px;padding:0 4px 18px}
.fig .k{font-size:11px;color:var(--dim)} .fig .v{font-size:18px;margin-top:2px}
.hist{padding:0 18px 26px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px}
.badge.sent{background:var(--muted);color:var(--dim)} .badge.pending{background:var(--warn-tint);color:var(--warn-ink)}

/* pièce de caisse électronique — charte DiDreams : bleu #14308C, jaune #FFC21A, gris, noir, blanc */
.piece{margin:0 0 14px;background:#fff;border:1px solid var(--border);border-radius:14px;position:relative;overflow:hidden;cursor:pointer}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px 14px 11px 16px;
  background:#14308C;border-bottom:3px solid #FFC21A}
.pc-co{font-size:10.5px;letter-spacing:.09em;font-weight:600;color:#fff}
.pc-kind{font-size:13px;font-weight:600;margin-top:2px;color:#fff}
.pc-no{font-size:12px;text-align:right;font-weight:500;color:#fff}
.pc-date{font-size:11px;margin-top:2px;text-align:right;color:#DCE3F7}
.pc-body{padding:10px 14px 4px 16px}
.pc-line{display:flex;gap:10px;font-size:12.5px;padding:3px 0;line-height:1.4}
.pc-line .k{width:82px;flex:none;color:#6B6B6B}
.pc-line .v{flex:1;min-width:0;color:#1A1A1A}
.pc-amt{display:flex;justify-content:space-between;align-items:baseline;margin:6px 14px 0 16px;padding:8px 12px;
  background:#F2F2F2;border-left:4px solid #14308C}
.pc-amt .k{font-size:10.5px;letter-spacing:.08em;color:#6B6B6B}
.pc-amt .v{font-size:20px;letter-spacing:-.01em;color:#14308C}
.pc-words{padding:6px 14px 10px 16px;font-size:11.5px;font-style:italic;color:#6B6B6B;line-height:1.4}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px 12px 16px;
  border-top:1px solid #E5E5E5;font-size:11px;color:#6B6B6B}
.pc-sign{line-height:1.5}
.pc-sign b{color:#1A1A1A;font-weight:600}
.pc-sign span{font-size:10px}
.stamp{border:1.5px solid;border-radius:6px;padding:2px 8px;font-size:10px;letter-spacing:.09em;font-weight:600;
  transform:rotate(-6deg);white-space:nowrap}
.stamp.sent{color:#14308C;border-color:#14308C}
.stamp.pending{background:#FFC21A;color:#1A1A1A;border-color:#FFC21A}
.stamp.refused{color:#1A1A1A;border-color:#1A1A1A}

/* écrans plein cadre : enrôlement, verrou */
.lockscreen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:30px;text-align:center;background:var(--surface);max-width:520px;margin:0 auto}
.lockscreen .logo{width:64px;height:64px;border-radius:18px;background:var(--ink);color:var(--on-dark);
  display:grid;place-items:center;font-size:24px;font-weight:600;letter-spacing:-.02em}
.lockscreen h1{margin:0;font-size:19px;font-weight:600}
.lockscreen p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.lockscreen .done,.lockscreen .cancelbtn{width:100%;max-width:320px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(28,25,23,.35);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;
  max-height:78vh;overflow:auto}
.sheet h2{margin:0;font-size:17px;font-weight:600}
.sheet .sub{font-size:12.5px;color:var(--dim);margin-top:-6px}
.opt{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;font-size:15px;cursor:pointer;
  min-height:50px;border:1px solid var(--border);background:var(--raised);font-family:inherit;text-align:left;width:100%}
.opt.sel{border-color:var(--ink);background:var(--selected)}
.opt .grow{flex:1;min-width:0}
.opt .code{font-size:11.5px;color:var(--faint)}
.opt .ck{font-size:14px;color:var(--in);opacity:0} .opt.sel .ck{opacity:1}
.done{border:0;padding:14px;border-radius:14px;background:var(--ink);color:var(--on-dark);text-align:center;
  font-size:15px;font-weight:500;min-height:48px;cursor:pointer;font-family:inherit}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{padding:15px;border-radius:12px;background:var(--raised);border:1px solid var(--border);
  text-align:center;font-size:19px;cursor:pointer;min-height:52px;user-select:none;font-family:'IBM Plex Mono',monospace}
.keypad button.del{background:var(--muted)}
.kamt{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px}
.kamt .k{font-size:13px;color:var(--faint)} .kamt .v{font-size:30px;letter-spacing:-.02em}
.notebox{border:1px solid var(--border);border-radius:12px;background:var(--raised);padding:12px 14px;
  min-height:88px;display:flex;align-items:flex-start}
.notebox input{width:100%;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink);padding:0}
.notebox input::placeholder{color:var(--place);opacity:1}
.damount input::placeholder{color:var(--place);opacity:1}
/* delete-entry sheet */
.entrysum{font-size:14px;color:var(--secondary);line-height:1.55}
.entrysum b{color:var(--ink)}
.sheetnote{font-size:12.5px;color:var(--dim);line-height:1.45}
.delbtn{border:0;width:100%;padding:14px;border-radius:14px;background:var(--out);color:#fff;text-align:center;
  font-size:15px;font-weight:600;min-height:48px;cursor:pointer;font-family:inherit}
.cancelbtn{border:1px solid var(--border);width:100%;padding:13px;border-radius:14px;background:transparent;
  color:var(--secondary);text-align:center;font-size:14.5px;font-weight:500;min-height:44px;cursor:pointer;font-family:inherit}

/* toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));
  max-width:488px;margin:0 auto;padding:13px 16px;border-radius:12px;background:var(--ink);color:var(--on-dark);
  font-size:13px;line-height:1.4;box-shadow:0 12px 30px rgba(28,25,23,.30);z-index:30}
.dtoast{display:none}

/* ============================ desktop ============================ */
.win{display:none}
@media (min-width:900px){
  body{padding:40px 20px}
  .shell{display:none}
  .toast{display:none}
  .win{display:block;width:100%;max-width:1160px;margin:0 auto;border-radius:14px;background:var(--surface);
    border:1px solid var(--border-strong);box-shadow:0 26px 70px rgba(28,25,23,.14);overflow:hidden;position:relative}
  .titlebar{display:flex;align-items:center;gap:9px;padding:11px 16px;background:var(--muted);border-bottom:1px solid var(--border-strong)}
  .titlebar .dots{display:flex;gap:6px}
  .titlebar .dots span{width:11px;height:11px;border-radius:50%;display:block}
  .titlebar .cap{flex:1;text-align:center;font-size:12px;color:var(--faint)}
  .whead{display:flex;align-items:center;justify-content:space-between;padding:18px 28px 16px;border-bottom:1px solid var(--hairline)}
  .whead .title{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .whead .right{display:flex;align-items:center;gap:22px}
  .whead .fig{text-align:right}
  .body{display:grid;grid-template-columns:400px 1fr;min-height:560px}
  .left{border-right:1px solid var(--hairline);padding:26px 28px;display:flex;flex-direction:column;gap:24px}
  .left .rows{padding:0;margin-top:0}
  .damount{display:flex;align-items:baseline;gap:8px}
  .damount input{border:0;outline:0;background:transparent;padding:0;width:220px;
    font-family:'IBM Plex Mono',monospace;font-size:42px;letter-spacing:-.03em;color:var(--place)}
  .damount input.out{color:var(--out)} .damount input.in{color:var(--in)}
  .damount .cur{font-size:15px;color:var(--faint)}
  .ledger{padding:22px 28px 30px;overflow:auto}
  .lhead,.lrow{display:grid;grid-template-columns:26px 1fr 2.2fr .9fr .7fr .9fr;gap:14px;align-items:center}
  .lhead{padding:0 4px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .lrow{padding:13px 4px;border-top:1px solid var(--hairline);cursor:pointer}
  .lrow .lcat{font-size:13.5px;font-weight:500}
  .lrow .lfor,.lrow .lsrc{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .lamt{font-size:14px;white-space:nowrap;text-align:right}
  .lrow .lamt.out{color:var(--out)} .lrow .lamt.in{color:var(--in)}
  .tiledot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px}
  .tiledot.out{background:var(--out-tint);color:var(--out)} .tiledot.in{background:var(--in-tint);color:var(--in)}
  .dialog-back{position:fixed;inset:0;background:rgba(28,25,23,.35);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:20}
  .dialog{width:420px;max-height:80vh;overflow:auto;background:var(--surface);border-radius:18px;padding:22px;
    display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 80px rgba(28,25,23,.30)}
  .dtoast{display:block;position:fixed;left:50%;bottom:34px;transform:translateX(-50%);padding:13px 20px;border-radius:12px;
    background:var(--ink);color:var(--on-dark);font-size:13px;z-index:30;box-shadow:0 12px 30px rgba(28,25,23,.30)}
}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================
   PASTE YOUR WEB APP URL HERE — it must end with /exec
   ============================================================ */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbx1uoE_eIFjZV20ykaxE5lQ6tHi4BhVc3LWIyAyqbkTMcsVIlt8BgD4_aP6Lh8vzdVN/exec';
var TOKEN    = 'dd-7Kq2mXv9Rt4LpZ8w';   // must match PWA_TOKEN in Form.gs
/* ========================================================== */

/* -------- reference data --------
   Accounting codes, activities and source codes MUST match the deployed
   Apps Script (WEB_CATS / WEB_SRC) and the SETUP sheet, otherwise the
   account-name lookup returns blank ("aucun libellé"). Kept in the
   Calm-Rows design; only the codes behind each label are the real ones. */
var OUT_CATS = [
  { label:"Rent", account:"6222", activity:"Shared" },
  { label:"Electricity", account:"6052", activity:"Shared" },
  { label:"Water", account:"6051", activity:"Shared" },
  { label:"Internet / CAMTEL", account:"6288", activity:"Marketing" },
  { label:"Supplies", account:"6047", activity:"Office" },
  { label:"Transport", account:"614", activity:"Shared" },
  { label:"Salary", account:"6611", activity:"Shared" },
  { label:"Bank fees", account:"6318", activity:"Shared" },
  { label:"Something else", account:"", activity:"Shared" }
];
var IN_CATS = [
  { label:"CEO cash advance", account:"571", activity:"Shared", type:"TRF", fixedSource:"CEO" },
  { label:"Client marketing", account:"706", activity:"Marketing" },
  { label:"Printing / copies", account:"706", activity:"Office" },
  { label:"Something else", account:"", activity:"Shared" }
];
var SOURCES = ["Cash box", "CEO"];

/* map the design's labels onto the codes the Apps Script backend expects */
var ACT_MAP = { Shared:"COMMON", Office:"OFFICE", Marketing:"MARKETING" };
var SRC_MAP = { "Cash box":"CASH", "CEO":"DIRECTOR" };

function sourceLabel(source){
  if(source === "CASH" || source === "Cash box") return "Cash box";
  if(["DIRECTOR", "Director", "CEO", "UBA", "UBA account", "MoMo", "COY-OM",
      "DIR-BANK", "Director's bank", "DIR-OM", "Orange Money"].indexOf(source) !== -1){
    return "CEO";
  }
  return source || "";
}

/* -------- state -------- */
var state = {
  screen:"entry", direction:"out", digits:"", category:null, source:null, description:"",
  sheet:null, picker:null, history:[], focus:null, selected:null, date:null,
  /* identité : fixée par l'appareil enrôlé, jamais choisie dans l'appli */
  user:null, device:null, secret:null, locked:false, bioOffer:false,
  enrollCode:"", enrollErr:"", busy:false, lockErr:""
};

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fmt(d){ return d ? Number(d).toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ") : "0"; }

/* -------- persistence -------- */
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k);
  localStorage.setItem(k,v);}catch(e){ return null; } }
function loadHistory(){ try{ return JSON.parse(localStorage.getItem("cl_history")||"[]"); }catch(e){ return []; } }
function saveHistory(){ try{ localStorage.setItem("cl_history",JSON.stringify(state.history)); }catch(e){} }
function queue(){ try{ return JSON.parse(localStorage.getItem("cl_queue")||"[]"); }catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem("cl_queue",JSON.stringify(q)); }catch(e){} }

/* -------- signature des saisies (HMAC-SHA256 avec la clé de l'appareil) -------- */
function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf),function(b){
  return ("0"+b.toString(16)).slice(-2); }).join(""); }
function hmac(secret,msg){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(secret),{ name:"HMAC", hash:"SHA-256" },false,["sign"])
    .then(function(k){ return crypto.subtle.sign("HMAC",k,enc.encode(msg)); }).then(hex);
}
function signPayload(p){
  p.device = state.device;
  p.ts = String(Date.now());
  var msg = [p.device,p.ts,p.cid,p.type,p.amount,p.account,p.source,p.date,p.description].join("|");
  return hmac(state.secret,msg).then(function(s){ p.sig = s; return p; });
}

/* -------- verrou biométrique (empreinte / Face ID de l'appareil) -------- */
function b64(buf){ var s=""; new Uint8Array(buf).forEach(function(b){ s+=String.fromCharCode(b); }); return btoa(s); }
function unb64(s){ var r=atob(s), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++){ a[i]=r.charCodeAt(i); } return a; }
function bioCapable(){
  return !!(window.PublicKeyCredential && navigator.credentials &&
            PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable);
}
function bioRegister(){
  return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(ok){
    if(!ok) throw new Error("none");
    return navigator.credentials.create({ publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{ name:"DiDreams" },
      user:{ id:crypto.getRandomValues(new Uint8Array(16)), name:state.user, displayName:"Mrs "+state.user },
      pubKeyCredParams:[{ type:"public-key", alg:-7 },{ type:"public-key", alg:-257 }],
      authenticatorSelection:{ authenticatorAttachment:"platform", userVerification:"required" },
      timeout:60000 } });
  }).then(function(c){ ls("cl_bio",b64(c.rawId)); });
}
function bioUnlock(){
  return navigator.credentials.get({ publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    allowCredentials:[{ type:"public-key", id:unb64(ls("cl_bio")) }],
    userVerification:"required", timeout:60000 } });
}

/* -------- backend -------- */
function send(payload){
  return fetch(ENDPOINT,{ method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify(payload) }).then(function(r){
      var st = r.status;
      return r.text().then(function(t){
        try{ return JSON.parse(t); }
        catch(e){
          var er = new Error("NONJSON");
          er.status = st;
          er.body = String(t).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,140);
          throw er;
        }
      });
    });
}
var flushing = false;   // empêche deux envois simultanés de la même saisie

function flush(){
  if(flushing) return;
  var q = queue();
  if(!q.length || !navigator.onLine) return;
  flushing = true;
  var next = q[0];
  send(next).then(function(res){
    flushing = false;
    var rest = queue();
    if(res && res.ok){
      rest = rest.filter(function(x){ return x.cid !== next.cid; });
      setQueue(rest);
      state.history.forEach(function(h){
        if(h.cid === next.cid){ h.sync = "Sent"; if(res.piece || res.ref){ h.piece = res.piece || res.ref; } }
      });
      saveHistory();
      if(!rest.length){ toast(q.length + (q.length>1?" vouchers recorded":" voucher recorded") + " ✓"); }
      render();
      flush();
    } else {
      // le serveur a répondu mais a refusé : 5 essais au maximum (aucun si l'appareil n'est pas reconnu), puis abandon
      rest.forEach(function(x){ if(x.cid === next.cid){
        x.tries = (res && res.code === "AUTH") ? 5 : (x.tries || 0) + 1; } });
      var dead = rest.filter(function(x){ return x.cid === next.cid && x.tries >= 5; });
      if(dead.length){
        rest = rest.filter(function(x){ return x.cid !== next.cid; });
        state.history.forEach(function(h){ if(h.cid === next.cid) h.sync = "Refused"; });
        saveHistory();
        toast((res && res.message) || "Entry refused by the server");
      }
      setQueue(rest);
      render();
    }
  }).catch(function(){ flushing = false; });
}

/* -------- helpers -------- */
var _toast=null;
function toast(text){ clearTimeout(_toast); state.toast=text; render();
  _toast=setTimeout(function(){ state.toast=null; render(); },2600); }

function cats(){ return state.direction==="out" ? OUT_CATS : IN_CATS; }
function currentCat(){ var l=state.category; return cats().filter(function(c){return c.label===l;})[0]; }
function ready(){ var cat=currentCat(); return state.device && state.user && state.digits && cat && (cat.fixedSource || state.source) && state.description.trim(); }

function todayTotals(){
  var out=0, inn=0, today=new Date().toDateString();
  state.history.forEach(function(h){
    if(new Date(h.ts).toDateString()!==today) return;
    if(h.dir==="out") out+=Number(h.raw||0); else inn+=Number(h.raw||0);
  });
  return { out:out, inn:inn };
}

/* -------- actions -------- */
function setDirection(dir){ return function(){
  var keep = (dir==="out"?OUT_CATS:IN_CATS).some(function(c){return c.label===state.category;});
  state.direction=dir; if(!keep) state.category=null; render();
}; }
function press(k){ return function(){
  if(k==="←"){ state.digits=state.digits.slice(0,-1); }
  else if(k==="000"){ state.digits = state.digits ? (state.digits+"000").slice(0,9) : state.digits; }
  else { state.digits = (state.digits+k).replace(/^0+/,"").slice(0,9); }
  render();
}; }

function keepQueued(p,msg){
  var q=queue(); q.push(p); setQueue(q);
  state.history.forEach(function(h){ if(h.cid===p.cid) h.sync="Pending"; }); saveHistory();
  toast(msg); render();
}

function submit(){
  if(!ready()) return;
  var cat = currentCat();
  var source = cat.fixedSource || state.source;
  var raw = state.digits;
  var online = navigator.onLine;
  var now = new Date();
  var vdate = state.date || todayISO();
  var cid = "cl-" + now.getTime() + "-" + Math.random().toString(36).slice(2,7);
  var hh = ("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2);

  var entry = {
    cid:cid, dir:state.direction, category:state.category,
    raw:raw, amount:(state.direction==="out"?"−":"+")+fmt(raw),
    description:state.description.trim(), source:source, movementType:cat.type, user:state.user, dev:state.device,
    account:cat.account, activity:cat.activity, piece:"", vdate:vdate,
    meta:state.user+" · "+hh+" · "+source, ts:now.toISOString(),
    sync:"Pending"            // passe à « Sent » seulement quand le serveur a numéroté la pièce
  };

  var payload = {
    token:TOKEN, amount:raw, type:cat.type || (state.direction==="out"?"OUT":"IN"),
    account:cat.account, activity:ACT_MAP[cat.activity]||cat.activity, category:cat.label,
    source:SRC_MAP[source]||source, description:state.description.trim(),
    counterparty:"", receipt:"",
    date:vdate,
    person:state.user, cid:cid
  };

  state.history.unshift(entry); saveHistory();
  // clear amount/category/source/note; keep direction and user
  state.digits=""; state.category=null; state.source=null; state.description=""; state.sheet=null; state.picker=null;
  render();

  signPayload(payload).then(function(p){
    if(!online){
      keepQueued(p,"Voucher kept on this phone — it will go out when the network is back");
      return;
    }
    return send(p).then(function(res){
      if(res && res.ok){
        state.history.forEach(function(h){
          if(h.cid===cid){ h.sync="Sent"; if(res.piece || res.ref){ h.piece=res.piece || res.ref; } }
        });
        saveHistory();
        toast("Voucher "+(entry.dir==="out"?"CPV-":"CRV-")+(res.piece || res.ref || "")+" recorded ✓");
      } else {
        keepQueued(p,(res && res.message) || "Refused by the server — kept on this phone");
      }
    }).catch(function(err){
      keepQueued(p,(err && err.message==="NONJSON")
        ? "The server replied with a web page: voucher kept on this phone."
        : "No connection — voucher kept on this phone");
    });
  }).catch(function(){
    toast("Signing is not possible on this device");
  });
}

function doEnroll(){
  var code = (state.enrollCode||"").replace(/\D/g,"");
  if(code.length<6){ state.enrollErr="Enter the 6-digit code"; render(); return; }
  if(!navigator.onLine){ state.enrollErr="A connection is required to activate the device"; render(); return; }
  state.busy=true; state.enrollErr=""; render();
  send({ token:TOKEN, action:"enroll", code:code }).then(function(res){
    state.busy=false;
    if(res && res.ok){
      state.device=res.device; state.secret=res.secret; state.user=res.person;
      ls("cl_device",res.device); ls("cl_secret",res.secret); ls("cl_user",res.person);
      state.enrollCode="";
      state.bioOffer = bioCapable() && !ls("cl_bio");
    } else {
      state.enrollErr = (res && !res.v && res.message === "Enter an amount.")
        ? "The server is running an old version of the code. Republish the Apps Script deployment (New version)."
        : ((res && res.message) || "Code refused");
    }
    render();
  }).catch(function(err){
    state.busy=false;
    state.enrollErr = (err && err.message==="NONJSON")
      ? "The server replied with a web page (HTTP "+err.status+"): “"+(err.body||"empty page")+"”"
      : "No response from the server: "+((err && err.message)||"network")+" (the request did not go through)";
    render();
  });
}

/* -------- montant en lettres + pièce de caisse -------- */
function wordsEn(n){
  n = Math.floor(Number(n)||0);
  if(n===0) return "zero";
  var O=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen",
         "fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  var T=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  function b100(x){ return x<20 ? O[x] : T[Math.floor(x/10)]+(x%10 ? "-"+O[x%10] : ""); }
  function b1000(x){
    var c=Math.floor(x/100), r=x%100, s="";
    if(c) s=O[c]+" hundred";
    if(r) s+=(s?" and ":"")+b100(r);
    return s;
  }
  var p=[], mil=Math.floor(n/1000000), k=Math.floor((n%1000000)/1000), r=n%1000;
  if(mil) p.push(b1000(mil)+" million");
  if(k)   p.push(b1000(k)+" thousand");
  if(r)   p.push((p.length && r<100 ? "and " : "")+b1000(r));
  return p.join(" ");
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function pad2(n){ return ("0"+n).slice(-2); }
function dparse(s){ var p=String(s).split("-"); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function dEn(d){ return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear(); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function minISO(){ var d=new Date(Date.now()-380*86400000); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
/* Largeurs Helvetica (1/1000 em) des caractères 32 à 126, pour aligner et couper les lignes */
var HW = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,
  278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,
  667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,
  333,500,278,556,500,722,500,500,500,334,260,334,584];
function chW(c){
  var k=c.charCodeAt(0);
  if(k>=32 && k<=126) return HW[k-32];
  if("ÉÈÊËÀÂÄÎÏÔÖÙÛÜ".indexOf(c)>=0) return 667;
  if("îï".indexOf(c)>=0) return 278;
  if(c==="ç") return 500;
  return 556;
}
function tw(s,size,bold){ var w=0; for(var i=0;i<s.length;i++){ w+=chW(s.charAt(i)); } return w*size/1000*(bold?1.06:1); }
function wrapText(s,size,maxW,bold){
  var words=String(s).split(" "), lines=[], cur="";
  words.forEach(function(w){
    var t = cur ? cur+" "+w : w;
    if(tw(t,size,bold)<=maxW || !cur){ cur=t; } else { lines.push(cur); cur=w; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function pdfStr(s){
  var m={8217:0x92,8212:0x97,8211:0x96,8220:0x93,8221:0x94,8230:0x85,8364:0x80,8722:0x2D,8239:0x20,160:0x20};
  var out="";
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(m[c]!==undefined) c=m[c]; else if(c>255) c=63;
    var ch=String.fromCharCode(c);
    out += (ch==="("||ch===")"||ch==="\\") ? "\\"+ch : ch;
  }
  return "("+out+")";
}

function piecesToPdf(list){
  var objs=["",""];
  function add(s){ objs.push(s); return objs.length; }
  var f1=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  var f2=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  var f3=add("<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>");
  var f4=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>");
  var f5=add("<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>");
  var res="/Resources << /Font << /F1 "+f1+" 0 R /F2 "+f2+" 0 R /F3 "+f3+" 0 R /F4 "+f4+" 0 R /F5 "+f5+" 0 R >> >>";
  var kids=[];
  list.forEach(function(h){
    var content=pieceContent(h);
    var c=add("<< /Length "+content.length+" >>\nstream\n"+content+"endstream");
    var p=add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 420] /Contents "+c+" 0 R "+res+" >>");
    kids.push(p+" 0 R");
  });
  objs[0]="<< /Type /Catalog /Pages 2 0 R >>";
  objs[1]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+kids.length+" >>";
  var pdf="%PDF-1.4\n", offs=[];
  objs.forEach(function(ob,i){ offs.push(pdf.length); pdf+=(i+1)+" 0 obj\n"+ob+"\nendobj\n"; });
  var xr=pdf.length;
  pdf+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  offs.forEach(function(of){ pdf+=("0000000000"+of).slice(-10)+" 00000 n \n"; });
  pdf+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
  var u=new Uint8Array(pdf.length);
  for(var i=0;i<pdf.length;i++){ u[i]=pdf.charCodeAt(i)&255; }
  return u;
}

function pdfBlob(list){ return new Blob([piecesToPdf(list)],{ type:"application/pdf" }); }
function saveBlob(blob,name){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); },1500);
}
function canShareFiles(){
  try{ return !!(navigator.canShare && window.File &&
    navigator.canShare({ files:[ new File(["x"],"a.pdf",{ type:"application/pdf" }) ] })); }
  catch(e){ return false; }
}
function findEntry(cid){ return state.history.filter(function(x){ return x.cid===cid; })[0]; }
function downloadPiece(cid){
  var h=findEntry(cid); if(!h) return;
  saveBlob(pdfBlob([h]), pieceNo(h)+".pdf");
  toast("Voucher downloaded ✓");
}
function sharePiece(cid){
  var h=findEntry(cid); if(!h) return;
  var f=new File([pdfBlob([h])], pieceNo(h)+".pdf", { type:"application/pdf" });
  navigator.share({ files:[f], title:pieceNo(h) }).catch(function(){});
}
function downloadAll(){
  var list=state.history.slice(0,100).reverse();
  if(!list.length) return;
  var d=new Date();
  saveBlob(pdfBlob(list),"Cash-vouchers-"+d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+".pdf");
  toast(list.length+(list.length>1?" vouchers downloaded":" voucher downloaded")+" ✓");
}

/* -------- render + focus management -------- */
function render(){
  if(state.locked){ el("app").innerHTML = lockHTML(); return; }
  if(!state.device){ el("app").innerHTML = enrollHTML(); return; }
  if(state.bioOffer){ el("app").innerHTML = bioOfferHTML(); return; }
  el("app").innerHTML = mobileHTML() + desktopHTML() + toastHTML(false) + toastHTML(true);
  // restore focus for text inputs
  if(state.focus==="note"){ var n=el("note"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } }
  if(state.focus==="damt"){ var a=el("damt"); if(a){ a.focus();
    try{ a.setSelectionRange(a.value.length,a.value.length); }catch(e){} } }
}

/* -------- event delegation -------- */
var prevSheetWatch = { was:false };
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]"); if(!t) return;
  var act = t.getAttribute("data-act"), p = t.getAttribute("data-p");
  if(act==="stop"){ return; }
  var prevSheet = state.sheet;
  switch(act){
    case "backdrop": state.sheet=null; state.picker=null; state.focus=null; state.selected=null; render(); break;
    case "dir": setDirection(p)(); break;
    case "screen":
      if(p==="history" && state.screen!=="history"){
        state.screen="history"; try{ history.pushState({ v:"h" },""); }catch(e){} render();
      } else if(p==="entry" && state.screen==="history"){
        if(history.state && history.state.v==="h"){ history.back(); } else { state.screen="entry"; render(); }
      }
      break;
    case "dl": downloadPiece(p); break;
    case "share": sharePiece(p); break;
    case "dlall": downloadAll(); break;
    case "keypad": state.sheet="keypad"; render(); break;
    case "key": press(p)(); break;
    case "picker": if(p==="source" && currentCat() && currentCat().fixedSource) break; state.sheet="picker"; state.picker=p; render(); break;
    case "note": state.sheet="note"; state.focus="note"; render(); break;
    case "date": state.sheet="date"; render(); break;
    case "datetoday": state.date=null; state.sheet=null; render(); break;
    case "users": state.sheet="users"; render(); break;
    case "close": state.sheet=null; state.picker=null; state.focus=null; state.selected=null; render(); break;
    case "pick":
      if(t.getAttribute("data-kind")==="category") state.category=p; else state.source=p;
      state.sheet=null; state.picker=null; render(); break;
    case "submit": submit(); break;
    case "hentry": state.selected=p; state.sheet="entry"; render(); break;
    case "del":
      state.history = state.history.filter(function(h){ return h.cid!==p; });
      setQueue(queue().filter(function(x){ return x.cid!==p; }));
      saveHistory();
      state.sheet=null; state.selected=null;
      toast("Voucher removed from this phone"); break;
    case "enroll": doEnroll(); break;
    case "bioenable":
      bioRegister().then(function(){
        state.bioOffer=false; state.sheet=null; toast("Biometric lock enabled ✓");
      }).catch(function(){ toast("Activation cancelled or unavailable on this device"); });
      break;
    case "biolater": state.bioOffer=false; render(); break;
    case "lock": state.sheet=null; state.locked=true; state.lockErr=""; render(); break;
    case "unlock":
      bioUnlock().then(function(){ state.locked=false; state.lockErr=""; render(); flush(); })
        .catch(function(){ state.lockErr="Verification cancelled or failed"; render(); });
      break;
  }
});

/* le bouton « retour » du téléphone ferme la feuille ouverte, puis revient de l'historique à la saisie */
document.addEventListener("click", function(){
  try{
    if(!prevSheetWatch.was && state.sheet){ history.pushState({ v: state.screen==="history" ? "hs" : "s" },""); }
    else if(prevSheetWatch.was && !state.sheet && history.state && (history.state.v==="s"||history.state.v==="hs")){ history.back(); }
  }catch(e){}
  prevSheetWatch.was = !!state.sheet;
}, false);
window.addEventListener("popstate", function(e){
  var v = e.state && e.state.v;
  if(v==="s" || v==="hs"){ return; }
  state.sheet=null; state.picker=null; state.focus=null; state.selected=null;
  state.screen = (v==="h") ? "history" : "entry";
  prevSheetWatch.was = false;
  render();
});

/* text inputs: update state without a disruptive full re-render on every keystroke */
document.addEventListener("input", function(e){
  if(e.target.id==="note"){ state.description = e.target.value; return; }
  if(e.target.id==="dateinput"){
    var dv=e.target.value;
    if(/^\d{4}-\d{2}-\d{2}$/.test(dv) && dv<=todayISO() && dv>=minISO()){ state.date=dv; }
    return;
  }
  if(e.target.id==="code"){ state.enrollCode = e.target.value.replace(/\D/g,"").slice(0,6); return; }
  if(e.target.id==="damt"){
    var v = e.target.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,9);
    state.digits = v; state.focus="damt"; render();
  }
});
/* keep the note's typed value when the sheet closes */
document.addEventListener("focusin", function(e){ if(e.target.id==="note") state.focus="note"; });

/* -------- network + verrou automatique -------- */
window.addEventListener("online", function(){ render(); flush(); });
window.addEventListener("offline", function(){ render(); });
var hiddenAt = 0;
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ hiddenAt = Date.now(); return; }
  // retour dans l'appli après plus d'une minute : on reverrouille
  if(state.device && ls("cl_bio") && hiddenAt && Date.now()-hiddenAt > 60000){ state.locked=true; state.lockErr=""; render(); }
  hiddenAt = 0;
  flush();
});
window.addEventListener("focus", flush);

/* -------- boot -------- */
(function(){
  state.history = loadHistory();
  var d = ls("cl_device"), s = ls("cl_secret"), u = ls("cl_user");
  if(d && s && u){ state.device=d; state.secret=s; state.user=u; }
  state.locked = !!(state.device && ls("cl_bio"));
  render();
  flush();
  setInterval(function(){ if(navigator.onLine && queue().length) flush(); }, 15000);
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
</script>
