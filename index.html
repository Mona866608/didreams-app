<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DiDreams</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123A6D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DiDreams">
<style>
/* ============================================================
   DiDreams receipt — presentation only. Charte: 8 colours,
   system fonts, tabular figures. No shadows / gradients /
   blanket rounded corners / emoji icons. Gold only marks,
   never carries text; red is errors only.
   ============================================================ */
:root{
  --ink:#123A6D; --paper:#FAFBF8; --card:#FFFFFF;
  --gold:#F5C518; --gold-soft:#FDF4D6; --green:#1F6B41; --green-soft:#DCEDE2;
  --rule:#D9DEE3; --muted:#6C7B88; --red:#C0392B; --black:#12181F;
  --accent:var(--ink);          /* flips to green in "money in" mode */
  --tap:44px;
}
body.in{ --accent:var(--green); }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--paper);color:var(--black);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:120px}

/* tabular figures so amount columns align in the sheet's mental model */
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- header ---------- */
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.row{display:flex;justify-content:space-between;align-items:center;min-height:var(--tap)}
.brand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.who{display:flex;gap:8px}
.who button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#C4D0DC;
  font-size:13px;padding:0 14px;min-height:var(--tap);border-radius:2px;font-weight:600}
.who button.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* status banners — colour + position carry the meaning at a glance */
.net{display:none;font-size:12px;line-height:1.35;padding:9px 18px;margin:10px -18px 0;font-weight:600}
.net.off{display:block;background:#7A2018;color:#FFD9D4}                 /* offline: dark red bar */
.net.queued{display:block;background:var(--gold-soft);color:#6A5300;     /* queued: gold marks, not carries */
  border-left:5px solid var(--gold);padding-left:13px}

/* money out / money in switch */
.toggle{display:flex;margin:14px -18px 0;gap:2px}
.toggle button{flex:1;padding:16px 8px;border:0;background:rgba(255,255,255,.08);
  color:#B7C4D2;font-size:15px;font-weight:600;min-height:var(--tap);
  border-bottom:3px solid transparent}
.toggle button.on{background:var(--paper);color:var(--ink);border-bottom-color:var(--gold)}
.toggle button.on.in{color:var(--green);border-bottom-color:var(--green)}

/* ---------- the receipt ---------- */
.slip{background:var(--card);margin:16px 14px 22px;padding:24px 20px 22px;
  border:1px solid var(--rule);border-top:0;position:relative}
/* torn top edge, like a ticket pulled off the roll */
.slip::before{content:"";position:absolute;left:-1px;right:-1px;top:-10px;height:11px;
  background:var(--card);border-top:1px solid var(--rule);
  -webkit-mask:
    linear-gradient(135deg,#000 46%,transparent 47%) 0 100%/12px 12px repeat-x,
    linear-gradient(45deg,#000 46%,transparent 47%) 0 100%/12px 12px repeat-x;
  mask:
    linear-gradient(135deg,#000 46%,transparent 47%) 0 100%/12px 12px repeat-x,
    linear-gradient(45deg,#000 46%,transparent 47%) 0 100%/12px 12px repeat-x}
.slip label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:8px}

/* amount is the centre of gravity */
.amt{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;
  border-bottom:2px solid var(--rule);padding-bottom:6px}
#amount{flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-size:clamp(42px,15vw,58px);font-weight:600;letter-spacing:-.02em;
  text-align:right;padding:0;color:var(--black);line-height:1.05}
#amount::placeholder{color:var(--muted);opacity:.5}
.cur{flex:none;font-size:14px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- sections & category chips ---------- */
.sect{padding:0 18px;margin-bottom:22px}
.sect>label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--card);color:var(--black);
  padding:0 15px;min-height:var(--tap);font-size:15px;border-radius:2px;font-weight:500;
  display:inline-flex;align-items:center;line-height:1.2}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* the neutral "Something else" escape hatch always sits apart at the end */
#cats .chip:last-child{margin-left:auto;border-style:dashed;color:var(--muted)}
#cats .chip:last-child.on{color:#fff;border-style:solid}

input[type=text],input[type=date]{width:100%;padding:0 14px;min-height:var(--tap);
  font-size:16px;border:1px solid var(--rule);background:var(--card);border-radius:2px;
  outline:0;font-family:inherit;color:var(--black)}
input[type=date]{padding-top:11px;padding-bottom:11px}
input:focus{border-color:var(--accent)}

/* visible focus that survives full sun — gold outline is a marker, not text */
input:focus-visible,.chip:focus-visible,.who button:focus-visible,
.toggle button:focus-visible,summary:focus-visible,#save:focus-visible{
  outline:3px solid var(--gold);outline-offset:2px}

details{margin:2px 18px 22px;border-top:1px solid var(--rule);padding-top:4px}
summary{font-size:14px;color:var(--ink);font-weight:600;list-style:none;
  padding:12px 0;min-height:var(--tap);display:flex;align-items:center;
  justify-content:space-between;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:700;font-size:18px;color:var(--muted)}
details[open] summary::after{content:"\2013"}
details .sect{padding:0;margin-top:16px}

/* ---------- validation bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);
  border-top:1px solid var(--rule);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:stretch}
.bar .echo{flex:1;min-width:0;align-self:center;font-size:12.5px;color:var(--muted);line-height:1.3}
.bar .echo b{color:var(--black);font-size:20px;display:block;letter-spacing:-.01em}
#save{border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700;
  padding:0 26px;min-height:56px;min-width:132px;border-radius:2px;letter-spacing:.01em}
#save:active{transform:translateY(1px)}
#save:disabled{background:#B9C2CA}

/* ---------- confirmation ---------- */
.done{position:fixed;inset:0;z-index:10;background:var(--paper);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  padding:30px calc(30px + env(safe-area-inset-right)) 30px calc(30px + env(safe-area-inset-left))}
.done.show{display:flex}
.tick{width:72px;height:72px;border-radius:50%;background:var(--green-soft);display:flex;
  align-items:center;justify-content:center;font-size:34px;color:var(--green);position:relative}
/* queued state: hide the JS glyph, draw a plain clock (no emoji) */
.tick.q{background:var(--gold-soft);color:#8A6D0B;font-size:0}
.tick.q::after{content:"";width:26px;height:26px;border:3px solid currentColor;border-radius:50%}
.tick.q::before{content:"";position:absolute;width:3px;height:9px;background:currentColor;
  border-radius:2px;transform:translateY(-4px)}
.done h2{font-size:22px;color:var(--ink)}
.done p{color:var(--muted);font-size:14.5px;text-align:center;line-height:1.55;max-width:30ch}
.done code{font-family:ui-monospace,Menlo,monospace;background:var(--gold-soft);padding:3px 8px;
  border-radius:2px;color:var(--ink);font-size:13px;font-weight:600}

/* ---------- error ---------- */
.err{margin:14px 18px 0;padding:12px 14px;background:#FBE3E5;border:1px solid #E4A9AE;
  border-left:5px solid var(--red);color:#8C1F27;font-size:14px;border-radius:2px;
  display:none;font-weight:500}
.err.show{display:block}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto !important;animation:none !important;transition:none !important}
  #save:active{transform:none}
}

/* ---------- dark mode, same charte ---------- */
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1621; --card:#16212E; --black:#EAF0F6;
    --rule:#2C3A4A; --muted:#93A2B2;
    --gold-soft:#2A2410; --green-soft:#14261C;
  }
  .toggle button.on{color:#DCE6F0}
  .toggle button.on.in{color:#7FD0A2}
  .net.queued{color:var(--gold)}
  .done code{color:#F5D97A}
}
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <span class="brand">DiDreams</span>
    <div class="who" id="who">
      <button data-p="Danielle">Danielle</button>
      <button data-p="Monique">Monique</button>
    </div>
  </div>
  <div class="net" id="net"></div>
  <div class="toggle">
    <button id="tOut" class="on">Money out</button>
    <button id="tIn">Money in</button>
  </div>
</div>

<div class="slip">
  <label>Amount</label>
  <div class="amt">
    <input id="amount" class="mono" inputmode="numeric" placeholder="0">
    <span class="cur">FCFA</span>
  </div>
</div>

<div class="err" id="err"></div>

<div class="sect"><label>What was it?</label><div class="chips" id="cats"></div></div>
<div class="sect"><label>Money came from / went to</label><div class="chips" id="srcs"></div></div>
<div class="sect"><label>What was it for?</label><input type="text" id="desc" placeholder="A few words"></div>

<details>
  <summary>More details</summary>
  <div class="sect"><label>Date</label><input type="date" id="date"></div>
  <div class="sect"><label>Who was paid, or who paid us?</label><input type="text" id="party" placeholder="Optional"></div>
  <div class="sect"><label>Activity</label><div class="chips" id="acts"></div></div>
  <div class="sect"><label>Receipt reference</label><input type="text" id="receipt" placeholder="Optional"></div>
</details>

<div class="bar">
  <div class="echo"><b id="echoAmt" class="mono">—</b><span id="echoCat">Pick a category</span></div>
  <button id="save">Record</button>
</div>

<div class="done" id="done">
  <div class="tick" id="tick">✓</div>
  <h2 id="doneTtl">Recorded</h2>
  <p id="doneMsg"></p>
</div>

<script>
/* ============================================================
   PASTE YOUR WEB APP URL HERE — it must end with /exec
   ============================================================ */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzD98s84YJhCYt6cZPoj7eLhSz_tHUhN3Xi9aSh8zizRR4r7hgImHX0gKDWDhIsT3-S/exec';
var TOKEN    = 'dd-7Kq2mXv9Rt4LpZ8w';   // must match PWA_TOKEN in Form.gs
/* ========================================================== */

var CATS = {
  OUT: [
    ['Rent','6222','COMMON','OUT'],
    ['Electricity','6052','COMMON','OUT'],
    ['Water','6051','COMMON','OUT'],
    ['Internet / CAMTEL','6281','MARKETING','OUT'],
    ['Office supplies','6055','OFFICE','OUT'],
    ['Cleaning','6241','COMMON','OUT'],
    ['Transport / taxi','614','COMMON','OUT'],
    ['Freelance work','6057','MARKETING','OUT'],
    ['Salary','6611','COMMON','OUT'],
    ['Bank / MoMo fees','6318','COMMON','OUT'],
    ['Tax / stamps','6418','COMMON','OUT'],
    ['Repay the director','4621','COMMON','TRF'],
    ['Something else','','COMMON','OUT']
  ],
  IN: [
    ['Marketing client','706','MARKETING','IN'],
    ['Printing / copies','706','OFFICE','IN'],
    ['Something else','','COMMON','IN']
  ]
};
var SRCS = [['Petty cash','CASH'],['UBA account','UBA'],['Company MoMo','COY-OM'],
            ['My bank','DIR-BANK'],['My Orange Money','DIR-OM']];
var ACTS = [['Office','OFFICE'],['Marketing','MARKETING'],['Shared','COMMON']];

var dir='OUT', cat=null, src=null, act=null, actTouched=false, person=null;
function el(i){return document.getElementById(i);}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k);
  localStorage.setItem(k,v);}catch(e){return null;} }

/* ---------- offline queue ---------- */
function queue(){ try{ return JSON.parse(localStorage.getItem('dd_queue')||'[]'); }
  catch(e){ return []; } }
function setQueue(q){ try{ localStorage.setItem('dd_queue',JSON.stringify(q)); }catch(e){} }

function send(payload){
  return fetch(ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}

function flush(){
  var q = queue();
  if(!q.length || !navigator.onLine) { banner(); return; }
  var next = q[0];
  send(next).then(function(res){
    if(res && res.ok){
      var rest = queue(); rest.shift(); setQueue(rest);
      banner(); flush();
    }
  }).catch(function(){ banner(); });
}

function banner(){
  var n = el('net'), q = queue().length;
  n.className = 'net';
  if(!navigator.onLine){
    n.className='net off';
    n.textContent = q ? ('Offline — ' + q + ' entr' + (q>1?'ies':'y') + ' waiting to send')
                      : 'Offline — entries will be saved and sent later';
  } else if(q){
    n.className='net queued';
    n.textContent = q + ' entr' + (q>1?'ies':'y') + ' waiting to send…';
  }
}

window.addEventListener('online', function(){ banner(); flush(); });
window.addEventListener('offline', banner);

/* ---------- ui ---------- */
function chips(id, list, pick){
  var box = el(id); box.innerHTML='';
  list.forEach(function(row){
    var b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=row[0];
    b.onclick=function(){
      [].forEach.call(box.children,function(x){x.classList.remove('on');});
      b.classList.add('on'); pick(row);
    };
    box.appendChild(b);
  });
}

function cats(){
  cat=null; actTouched=false;
  chips('cats', CATS[dir], function(row){
    cat=row;
    if(!actTouched){
      act=null;
      [].forEach.call(el('acts').children,function(x,i){
        x.classList.toggle('on', ACTS[i][1]===row[2]);
        if(ACTS[i][1]===row[2]) act=ACTS[i];
      });
    }
    echo();
  });
  echo();
}

function setDir(d){
  dir=d;
  el('tOut').className = d==='OUT'?'on':'';
  el('tIn').className  = d==='IN'?'on in':'';
  document.body.classList.toggle('in', d==='IN');
  cats();
}
el('tOut').onclick=function(){setDir('OUT');};
el('tIn').onclick =function(){setDir('IN');};

el('amount').addEventListener('input',function(){
  var raw=this.value.replace(/[^0-9]/g,'');
  this.value = raw?fmt(raw):'';
  echo();
});

function echo(){
  var raw=el('amount').value.replace(/[^0-9]/g,'');
  el('echoAmt').textContent = raw ? fmt(raw)+' F' : '—';
  el('echoCat').textContent = cat ? cat[0]+(src?' · '+src[0]:'') : 'Pick a category';
}

function fail(m){ var e=el('err'); e.textContent=m; e.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'}); }

function finish(queued, ref){
  el('tick').className = queued ? 'tick q' : 'tick';
  el('tick').textContent = queued ? '⏳' : '✓';
  el('doneTtl').textContent = queued ? 'Saved on this phone' : 'Recorded';
  el('doneMsg').innerHTML = queued
    ? 'No connection right now.<br>It will be sent by itself once you are back online.'
    : 'Saved as <code>' + ref + '</code><br>Monique will check it before it counts.';
  el('done').classList.add('show');
  setTimeout(function(){ location.reload(); }, 2400);
}

el('save').onclick=function(){
  el('err').classList.remove('show');
  var raw=el('amount').value.replace(/[^0-9]/g,'');
  if(!raw)  return fail('Enter an amount.');
  if(!cat)  return fail('Pick a category.');
  if(!src)  return fail('Say where the money came from or went to.');
  if(!el('desc').value.trim()) return fail('Say what it was for.');

  var payload = {
    token: TOKEN,
    amount: raw,
    type: cat[3],
    account: cat[1],
    activity: act ? act[1] : cat[2],
    category: cat[0],
    source: src[1],
    description: el('desc').value.trim(),
    counterparty: el('party').value.trim(),
    receipt: el('receipt').value.trim(),
    date: el('date').value,
    person: person || 'unknown'
  };

  el('save').disabled=true; el('save').textContent='Saving…';

  if(!navigator.onLine){
    var q=queue(); q.push(payload); setQueue(q); banner(); finish(true); return;
  }

  send(payload).then(function(res){
    if(res && res.ok){ finish(false, res.ref); }
    else {
      el('save').disabled=false; el('save').textContent='Record';
      fail((res && res.message) || 'Refused by the server.');
    }
  }).catch(function(){
    var q=queue(); q.push(payload); setQueue(q); banner(); finish(true);
  });
};

/* ---------- boot ---------- */
(function(){
  var d=new Date();
  el('date').value = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  chips('srcs', SRCS, function(v){ src=v; echo(); });
  chips('acts', ACTS, function(v){ act=v; actTouched=true; });
  cats();
  person = ls('dd_person');
  [].forEach.call(el('who').children,function(b){
    if(b.dataset.p===person) b.classList.add('on');
    b.onclick=function(){
      [].forEach.call(el('who').children,function(x){x.classList.remove('on');});
      b.classList.add('on'); person=b.dataset.p; ls('dd_person',person);
    };
  });
  banner(); flush();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
